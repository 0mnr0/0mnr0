<body>
	<style>
@import url('https://fonts.googleapis.com/css2?family=Chokokutai&family=Tektur:wght@400..900&display=swap');


* {
  font-family: "Tektur", sans-serif;
  font-optical-sizing: auto;
  font-weight: 500;
  font-style: normal;
  font-variation-settings:
    "wdth" 100;
}
body {margin: 0px; color: white}
.content, html { position: relative; overflow: hidden }
	
.UserStats {
    display: flex;
    position: absolute;
    z-index: 1;
    top: 50%;
    width: 100%;
    justify-content: center;
    transform: translateY(-100%);
    gap: 10%;
}
		
video.background, video.foreground {z-index: -1; position: absolute; top: 0; left; 0; width: 100%; height: 100%; object-fit: cover}
video.foreground {z-index: 2;}
		
.UserStats img {
    backdrop-filter: blur(12px) brightness(0.65);
    border-radius: 20px;
    border: solid 1px white;
    width: fit-content;
	scale: 1;
    height: 160px;
    object-fit: contain;
}
.username {
    font-family: 'Tektur';
    position: absolute;
    z-index: 1;
    font-size: 20px;
    width: 100%;
    text-align: right;
    right: 20px;
    bottom: 12px;
}
span.invisiblehelpers {opacity: 0}
</style>
	<style id="playwhight"> .content, html {width: 912px; height: 513px;} </style>
	<div class="content">
		<video class="background" muted loop onerror="this.style.background='red'" src="https://github.com/0mnr0/0mnr0/raw/refs/heads/main/files/background.webm"></video>
		<video class="foreground" muted loop onerror="this.style.background='green'" src="https://github.com/0mnr0/0mnr0/raw/refs/heads/main/files/foreground.webm"></video>
		
		
		<div class="UserStats">
			<img src="https://github-readme-stats.vercel.app/api?username=0mnr0&hide_border=true&locale=ru&border_radius=10&text_color=fff&show_icons=true&disable_animations=true&show=discussions_started&bg_color=00000000&title_color=ffffff">
			<img src="https://github-readme-stats.vercel.app/api/top-langs/?username=0mnr0&card_width=380&hide_border=true&layout=compact&text_color=fff&border_radius=10&show_icons=true&disable_animations=true&theme=date_night&border_radius=10&locale=ru&bg_color=00000000&title_color=ffffff">
		</div>
		
		<span class="username"> dsvl0 </span>
	</div>
</body>
