<body>
	<style>
@import url('https://fonts.googleapis.com/css2?family=Chokokutai&family=Tektur:wght@400..900&display=swap');


* {
  font-family: "Tektur", sans-serif;
  font-optical-sizing: auto;
  font-weight: 500;
  font-style: normal;
  font-variation-settings:
    "wdth" 100;
}
body {margin: 0px; color: white}
.content, html { position: relative; overflow: hidden }

video.background, video.foreground {z-index: -1; position: absolute; top: 0; left; 0; width: 100%; height: 100%; object-fit: cover}
video.foreground {z-index: 2;}
	
.UserStats {
    display: flex;
    flex-direction: row;
    position: absolute;
    z-index: 1;
    top: 80%;
    width: 100%;
    justify-content: center;
    transform: translateY(-50%);
    gap: 40px;
    left: 0%;
}
		
.UserStats img {
    backdrop-filter: blur(12px) brightness(0.65);
    border-radius: 20px;
    border: solid 1px transparent;
    width: 340px;
    scale: 1;
    height: 165px;
    object-fit: contain;
}

.UserStats img:not(.exc) {
	height: -webkit-fill-available;
}

.username {
    font-family: 'Tektur';
    position: absolute;
    z-index: 1;
    font-size: 20px;
    width: 100%;
    text-align: right;
    right: 11px;
    bottom: 6px;
}
span.invisiblehelpers {opacity: 0}
</style>
	<style id="playwhight"> .content, html {width: 992px; height: 558px;}  </style>
	<div class="content">
		<video class="background" autoplay muted loop onerror="this.style.background='red'" src="background.webm"></video>
		
		
		<div class="UserStats">
			<img class="exc" src="https://github-readme-stats.vercel.app/api?username=0mnr0&hide_border=true&locale=ru&border_radius=10&text_color=fff&show_icons=true&disable_animations=true&show=discussions_started&bg_color=00000000&title_color=ffffff">
			<img src="https://github-readme-stats.vercel.app/api/top-langs/?username=0mnr0&card_width=380&hide_border=true&layout=compact&text_color=fff&border_radius=10&show_icons=true&disable_animations=true&theme=date_night&border_radius=10&locale=ru&bg_color=00000000&title_color=ffffff">
		</div>
		
		<span class="username"> dsvl0 </span>
	</div>
</body>
